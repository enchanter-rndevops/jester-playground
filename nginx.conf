server {
    listen 8000;
    server_name localhost;

    # dist をそのまま配信
    root /usr/share/nginx/html;

    # 静的ファイルはそのまま返す
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API は backend に流す
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
