name: Generate Markdown Index

on:
  push:
    branches:
      - main # 必要に応じて対象ブランチに変更すること

permissions:
  contents: write # コミットを自動プッシュするために必要

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: .github/actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TOC Generation Script
        run: python scripts/generate_toc.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-generate markdown index" && git push)
